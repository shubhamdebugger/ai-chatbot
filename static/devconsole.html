<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ms Tanya — Dev Console</title>
<style>
:root{--brand:#7a1f5c;--bg:#f6f4f5;--card:#fff;--ink:#1c1b1c;--mute:#6a6468;--line:#e3dde1;--fixed:#eef2f7;--ai:#fbeef6;--me:#e8f5ec;--warn:#b54708}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}
header select,header button,header input{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid #ffffff55;background:#ffffff18;color:#fff}
header option{color:#000}
header button{cursor:pointer}
.banner{background:#fff4e5;color:var(--warn);padding:6px 16px;font-size:12.5px;border-bottom:1px solid #f3d9b8}
main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(340px,1.1fr);gap:12px;padding:12px;height:calc(100vh - 92px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.status{margin-left:auto;color:var(--mute);font-size:12.5px}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:85%;padding:8px 11px;border-radius:12px;white-space:pre-wrap}
.b.user{align-self:flex-end;background:var(--me)}
.b.ai{align-self:flex-start;background:var(--ai)}
.b.fixed{align-self:flex-start;background:var(--fixed)}
.b.staff{align-self:flex-start;background:#fff7d6}
.tag{display:block;font-size:10.5px;color:var(--mute);margin-bottom:2px}
.blocked{display:block;font-size:11px;color:var(--warn);margin-top:4px}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
form input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
form button{padding:9px 14px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;cursor:pointer}
#side{overflow:auto;padding:10px 12px}
#side h3{font-size:13px;margin:12px 0 4px;color:var(--brand)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
th{background:#f7eef4}
pre{background:#faf8f9;border:1px solid var(--line);padding:8px;border-radius:6px;white-space:pre-wrap;font-size:12px;margin:0}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#f1e3ec;margin:1px;font-size:12px}
.hot{background:#ffd9d6}.warm{background:#ffe9c7}.nurture{background:#e3f1ff}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#chat{min-height:50vh}}
</style>
</head>
<body>
<header>
  <h1>Ms Tanya · Dev Console</h1>
  <select id="user"></select>
  <button id="appopen" title="Simulate the app-open event">App opened</button>
  <button id="endsess" title="Close the session → session note + Lead Brief">End session</button>
  <button id="staff" title="Simulate a staff reply in the CRM → HUMAN mode">Staff replies</button>
  <button id="release">Back to BOT</button>
  <button id="reset">Reset user</button>
  <select id="ks" title="Kill switch (AI-C20)"><option value="off">Kill switch: off</option><option value="limited">limited</option><option value="stopped">stopped</option></select>
  <input id="clock" type="datetime-local" title="Set the clock (test night hand-off)">
  <button id="setclock">Set clock</button>
  <button id="audit">Morning audit</button>
  <span id="prov" style="margin-left:auto;font-size:12px"></span>
</header>
<div class="banner">Placeholders: prices, plan inclusions, SEBI registration text and FAQ answers are marked TO CONFIRM until Tushar's approved files replace them (inputs C1–C3, D1). Test users are fictional.</div>
<main>
  <section class="panel">
    <div class="chathead"><div class="avatar">T</div><div><b>Ms Tanya</b><br><small id="who"></small></div><div class="status" id="status">online</div></div>
    <div id="chat"></div>
    <form id="f"><input id="msg" autocomplete="off" placeholder="Type as the customer…"><button>Send</button></form>
  </section>
  <section class="panel"><div id="side"><p style="color:var(--mute)">Send a message to see what Tanya understood, decided and checked.</p></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
let users=[],lastTrace=null;
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});if(!r.ok)throw new Error(await r.text());const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text();}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function bubble(role,text,tag,blocked){const d=document.createElement('div');d.className='b '+role;d.innerHTML=(tag?`<span class="tag">${esc(tag)}</span>`:'')+esc(text)+(blocked?`<span class="blocked">guard replaced: ${esc(blocked)}</span>`:'');$('#chat').appendChild(d);$('#chat').scrollTop=1e9;}
function uid(){return $('#user').value}
async function load(){const d=await api('/dev/users');users=d.users;$('#prov').textContent=`provider: ${d.provider} · clock: ${d.clock}`;$('#ks').value=d.killswitch;
  $('#user').innerHTML=users.map(u=>`<option value="${u.user_id}">${u.name} — ${esc(u.about)}</option>`).join('');await show();}
async function show(){const s=await api('/dev/state/'+uid());$('#chat').innerHTML='';const u=users.find(x=>x.user_id===uid());$('#who').textContent=`${u.name} · ${u.user_id} · consent ${u.consent?'yes':'NO'}`;
  if(s.exists){for(const m of s.messages){const role=m.role==='user'?'user':(m.role==='staff'?'staff':((m.meta||{}).id==='AI'?'ai':'fixed'));bubble(role,m.text,m.role==='assistant'?`${(m.meta||{}).id} · ${(m.meta||{}).action||''}`:(m.role==='staff'?'staff (CRM)':''));}}
  side(null,s);}
function kv(o){return `<table>${Object.entries(o||{}).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(typeof v==='object'?JSON.stringify(v):v)}</td></tr>`).join('')}</table>`}
function side(t,s,brief){let h='';
  if(t){const g=t.guard||{};h+=`<h3>This turn</h3>${kv({action:t.action,reason:t.reason,addon:t.addon?`${t.addon} ${JSON.stringify(t.addon_detail)}`:'-',model_tier:t.tier,language:t.language,mood:t.mood,gate:t.gate})}
  <h3>Labels (with his words)</h3>${Object.keys(t.labels_on||{}).length?kv(t.labels_on):'<i>none</i>'}${t.understand_failed?'<p style="color:var(--warn)">understand call failed → safe defaults</p>':''}
  <h3>SEBI guard</h3>${kv({net_blocked:g.net_blocked,net_hits:(g.net_hits||[]).join(' | ')||'-',warnings:(g.warnings||[]).join(' | ')||'-',ai_check:g.ai_pass,ai_problems:(g.ai_problems||[]).join(' | ')||'-',replaced:g.replaced})}
  <h3>Knowledge used · golden examples</h3>${kv({knowledge:(t.knowledge||[]).join(', ')||'-',golden:(t.golden||[]).join(', ')||'-',content_version:t.content_version})}
  <h3>AI calls and cost</h3><table><tr><th>purpose</th><th>model</th><th>in/out</th><th>ms</th><th>₹</th></tr>${(t.llm_calls||[]).map(c=>`<tr><td>${c.purpose}</td><td>${esc(c.model)}</td><td>${c.in}/${c.out}</td><td>${c.ms}</td><td>${c.cost_inr}</td></tr>`).join('')}</table>
  <p>Turn ₹${t.cost_inr} · spend today ₹${t.spend_today_inr}${t.spend_alert?' <b style="color:var(--warn)">≥80% of ceiling</b>':''}</p>`;}
  if(s&&s.exists){const temp=(s.temperature||{}).label||'-';h+=`<h3>Temperature</h3><span class="pill ${temp.toLowerCase().replace(' ','')}">${temp}</span> ${esc(((s.temperature||{}).evidence||[]).join(' · '))}
  <h3>Known facts (never asked again)</h3><table><tr><th>field</th><th>value</th><th>his words</th><th>source</th><th>at</th></tr>${Object.entries(s.facts).map(([k,f])=>`<tr><td>${k}</td><td>${esc(f.value)}</td><td>${esc(f.his_words)}</td><td>${f.source}</td><td>${esc(f.at.slice(0,16).replace('T',' '))}</td></tr>`).join('')}</table>
  ${s.conflicts.length?`<h3>Check on the call (agent note vs his words)</h3>${kv(Object.fromEntries(s.conflicts.map(c=>[c.field,`agent: ${c.agent_value} · he said: ${c.customer_value}`])))}`:''}
  <h3>Journey · counters · mode</h3>${kv({trial_day:s.trial_day,last_promise:s.journey.last_promise||'-',cards_shown:(s.journey.cards_shown||[]).join(', ')||'-',education_today:`${s.counters.education_used}`,session:`#${s.session.id} · failed ${s.session.failed} · profile Qs ${s.session.profile_q} · selling paused ${s.session.selling_paused}`,mode:s.mode.state})}
  <h3>Cases · callbacks</h3>${kv({cases:s.cases.map(c=>`${c.case_no} ${c.kind} ${c.status}`).join(' | ')||'-',callbacks:s.callbacks.map(c=>`${c.kind} ${c.state} (${c.when_text})`).join(' | ')||'-'})}
  ${s.session_notes.length?`<h3>Session notes</h3><pre>${esc(s.session_notes.map(n=>n.at.slice(0,16)+'\n'+n.lines.join('\n')).join('\n\n'))}</pre>`:''}
  <h3>Lead Brief (Ms Tanya's CRM note)</h3><pre>${esc(brief||'(appears after the next turn)')}</pre>
  <h3>Agent Short-Call Card</h3><pre>${esc(JSON.stringify(s.agent_card,null,1))}</pre>`;}
  $('#side').innerHTML=h||$('#side').innerHTML;}
async function turn(path,body){$('#status').textContent='thinking…';try{const d=await api(path,body);for(const b of d.bubbles)bubble(b.kind==='ai'?'ai':'fixed',b.text,`${b.id} · ${d.trace.action}`,b.blocked_text);if(!d.bubbles.length)bubble('fixed','(no reply — '+d.trace.gate+')','silent');side(d.trace,d.state,d.brief);}catch(e){bubble('fixed','Error: '+e.message,'error');}$('#status').textContent='online';}
$('#f').onsubmit=async e=>{e.preventDefault();const t=$('#msg').value.trim();if(!t)return;$('#msg').value='';bubble('user',t);await turn('/dev/chat',{user_id:uid(),text:t});};
$('#user').onchange=show;
$('#appopen').onclick=()=>turn('/dev/event',{user_id:uid()});
$('#endsess').onclick=async()=>{const d=await api('/dev/end_session',{user_id:uid()});side(null,d.state);};
$('#staff').onclick=async()=>{const t=prompt('Staff reply text','Namaste, main team se bol raha hoon.');if(t===null)return;await api('/dev/staff',{user_id:uid(),text:t});await show();};
$('#release').onclick=async()=>{await api('/dev/release',{user_id:uid()});await show();};
$('#reset').onclick=async()=>{await api('/dev/reset',{user_id:uid()});await show();};
$('#ks').onchange=async()=>{await api('/dev/killswitch',{state:$('#ks').value});};
$('#setclock').onclick=async()=>{const v=$('#clock').value;const d=await api('/dev/clock',{iso:v?v+':00':''});$('#prov').textContent=$('#prov').textContent.replace(/clock: .*/,'clock: '+d.clock);};
$('#audit').onclick=async()=>{const t=await api('/dev/audit');$('#side').innerHTML=`<h3>Morning audit</h3><pre>${esc(t)}</pre>`;};
load();
</script>
</body>
</html>
